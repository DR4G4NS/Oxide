name: Release

# Builds native release binaries for every public host platform and attaches
# them to a GitHub Release when a version tag is pushed.
#
# Triggers:
#   - push of tags matching v* (e.g. v0.1.0)
#   - workflow_dispatch (build matrix only; no Release unless on a tag)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: oxide-linux-x86_64
            bin: oxide

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: oxide-linux-aarch64
            bin: oxide

          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: oxide-windows-x86_64.exe
            bin: oxide.exe

          - name: windows-aarch64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: oxide-windows-aarch64.exe
            bin: oxide.exe

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: oxide-macos-aarch64
            bin: oxide

          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: oxide-macos-x86_64
            bin: oxide

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          dest="dist/${{ matrix.artifact }}"
          cp "$src" "$dest"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            strip "$dest" || true
            chmod +x "$dest"
          fi
          (
            cd dist
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
            else
              shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
            fi
          )
          ls -la dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Oxide ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Prebuilt Oxide server binaries for Mindustry v8 **159.7**.

            | Platform | File |
            |---|---|
            | Windows x86-64 | `oxide-windows-x86_64.exe` |
            | Windows ARM64 | `oxide-windows-aarch64.exe` |
            | Linux x86-64 | `oxide-linux-x86_64` |
            | Linux ARM64 | `oxide-linux-aarch64` |
            | macOS Apple Silicon | `oxide-macos-aarch64` |
            | macOS Intel | `oxide-macos-x86_64` |

            Each binary has a matching `.sha256` checksum. Example:

            ```bash
            chmod +x oxide-linux-x86_64
            ./oxide-linux-x86_64 --port 6567 --tps 60 --max-players 100
            ```

            Build from source if you prefer: `cargo build --release`.
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
