[package]
name = "oxide"
version = "0.1.0"
edition = "2021"
authors = ["Oxide"]
license = "Apache-2.0"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"
crossbeam-channel = "0.5"
bytes = "1.6"
byteorder = "1.5"
lz4_flex = "0.11"
flate2 = "1.0"
parking_lot = "0.12"
dashmap = "5.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
rustyline-async = "0.4"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
crc32fast = "1.4"
log = "0.4.33"
env_logger = "0.11.11"
base64 = "0.22.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
